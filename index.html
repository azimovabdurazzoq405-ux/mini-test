<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>O‘quvchi Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
      padding: 20px 10px;
    }

    .box {
      background: white;
      max-width: 450px;
      margin: auto;
      padding: 25px;
      border-radius: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      font-size: 17px;
      border: none;
      border-radius: 12px;
      background: #eeeeee;
    }

    h1 {
      font-size: 30px;
    }

    #natija {
      font-size: 20px;
      font-weight: bold;
    }

    #test {
      display: none;
    }
  </style>
</head>

<body>

<div class="box">

  <div id="menu">
    <h1>📚 O‘quvchi Test</h1>
<input
  type="text"
  id="ism"
  placeholder="Ismingizni kiriting"
>
    <p>Fan tanlang:</p>

    <button onclick="boshlash('matematika')">
      ➕ Matematika
    </button>

    <button onclick="boshlash('ingliz')">
      🇬🇧 Ingliz tili
    </button>

  </div>


  <div id="test">

    <h2 id="fanNomi"></h2>

    <p id="raqam"></p>

    <h2 id="savol"></h2>

    <div id="javoblar"></div>

    <p id="natija"></p>

  </div>

</div>


<script>

const testlar = {

  matematika: [

    {
      savol: "5 + 7 = ?",
      javoblar: ["10", "12", "14"],
      togri: 1
    },

    {
      savol: "8 × 2 = ?",
      javoblar: ["14", "16", "18"],
      togri: 1
    },

    {
      savol: "20 - 8 = ?",
      javoblar: ["10", "12", "14"],
      togri: 1
    },

    {
      savol: "36 ÷ 6 = ?",
      javoblar: ["5", "6", "7"],
      togri: 1
    },

    {
      savol: "9 + 6 = ?",
      javoblar: ["13", "15", "17"],
      togri: 1
    }
  ],


  ingliz: [

    {
      savol: "Apple so‘zi nimani anglatadi?",
      javoblar: ["Olma", "Kitob", "Uy"],
      togri: 0
    },

    {
      savol: "Book so‘zi nimani anglatadi?",
      javoblar: ["Qalam", "Kitob", "Maktab"],
      togri: 1
    },

    {
      savol: "Cat so‘zi nimani anglatadi?",
      javoblar: ["It", "Mushuk", "Ot"],
      togri: 1
    },

    {
      savol: "School so‘zi nimani anglatadi?",
      javoblar: ["Maktab", "Uy", "Do‘kon"],
      togri: 0
    },

    {
      savol: "Water so‘zi nimani anglatadi?",
      javoblar: ["Suv", "Non", "Sut"],
      togri: 0
    }
  ]

};


let tanlanganFan = "";
let foydalanuvchiIsmi = "";
let savolRaqami = 0;

let ball = 0;


function boshlash(fan) {
foydalanuvchiIsmi = document.getElementById("ism").value;

if (foydalanuvchiIsmi.trim() === "") {
  alert("Iltimos, ismingizni kiriting!");
  return;
}
  tanlanganFan = fan;

  savolRaqami = 0;

  ball = 0;

  document.getElementById("menu").style.display = "none";

  document.getElementById("test").style.display = "block";

  if (fan === "matematika") {

    document.getElementById("natija").innerText =
  "🏆 " + foydalanuvchiIsmi + ", natijangiz: " + ball + " / " + test.length;

  } else {

    document.getElementById("fanNomi").innerText =
      "🇬🇧 Ingliz tili";

  }

  savolniChiqar();

}


function savolniChiqar() {

  let test = testlar[tanlanganFan];

  document.getElementById("raqam").innerText =
    "Savol " + (savolRaqami + 1) + " / " + test.length;

  document.getElementById("savol").innerText =
    test[savolRaqami].savol;


  let javoblar = "";

  test[savolRaqami].javoblar.forEach(function(javob, index) {

    javoblar +=
      `<button onclick="javobniTekshir(${index})">${javob}</button>`;

  });


  document.getElementById("javoblar").innerHTML =
    javoblar;

}


function javobniTekshir(tanlangan) {

  let test = testlar[tanlanganFan];


  if (tanlangan === test[savolRaqami].togri) {

    ball++;

  }


  savolRaqami++;


  if (savolRaqami < test.length) {

    savolniChiqar();

  } else {

    document.getElementById("savol").innerText =
      "🎉 Test tugadi!";

    document.getElementById("raqam").innerText = "";

    document.getElementById("javoblar").innerHTML = "";

    document.getElementById("natija").innerText =
      "🏆 Natijangiz: " + ball + " / " + test.length;

  }

}

</script>

</body>
</html>
