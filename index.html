<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>O‘quvchi Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
      padding: 25px 10px;
    }

    .box {
      background: white;
      max-width: 450px;
      margin: auto;
      padding: 25px;
      border-radius: 20px;
    }

    h1 {
      font-size: 30px;
    }

    .fan {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      font-size: 18px;
      border: none;
      border-radius: 12px;
    }

    #test {
      display: none;
    }
  </style>
</head>

<body>

<div class="box">

  <div id="boshMenu">

    <h1>📚 O‘quvchi Test</h1>

    <p>Fanni tanlang:</p>

    <button class="fan" onclick="testniBoshlash()">
      ➕ Matematika
    </button>

    <button class="fan" onclick="testniBoshlash()">
      🇬🇧 Ingliz tili
    </button>

  </div>


  <div id="test">

    <h2 id="savol"></h2>

    <div id="javoblar"></div>

    <p id="natija"></p>

  </div>

</div>


<script>

function testniBoshlash() {

  document.getElementById("boshMenu").style.display = "none";

  document.getElementById("test").style.display = "block";

  document.getElementById("savol").innerText =
    "2 + 3 = ?";

  document.getElementById("javoblar").innerHTML = `
    <button class="fan" onclick="tekshir(false)">4</button>
    <button class="fan" onclick="tekshir(true)">5</button>
    <button class="fan" onclick="tekshir(false)">6</button>
  `;
}

function tekshir(togri) {

  if (togri) {
    document.getElementById("natija").innerText =
      "✅ To‘g‘ri javob!";
  } else {
    document.getElementById("natija").innerText =
      "❌ Noto‘g‘ri javob!";
  }

}

</script>

</body>
</html>
